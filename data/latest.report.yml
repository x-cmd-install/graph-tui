_at":"2026-11-04T13:15:39Z","updated_at":"2026-11-04T13:15:39Z"},{"id":709571365,"node_id":"RA_kwDOVeNBwM4qSzMl","name":"graph-tui-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1060268,"digest":"sha256:509af61fd2c4790a26b202f8ea12cd4dd2c93cd379c17ff32852961f38402c00","download_count":1,"created_at":"2026-11-04T13:15:39Z","updated_at":"2026-11-04T13:15:39Z"},{"id":709575208,"node_id":"RA_kwDOVeNBwM4qS0Io","name":"graph-tui-x86_64-unknown-linux-musl.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":109,"digest":"sha256:28ab3018f1f7bbc1ca48a36f8cba1b93296a170757750a6460f146e568ec9f16","download_count":2,"created_at":"2026-11-04T13:16:40Z","updated_at":"2026-11-04T13:16:40Z"},{"id":709575214,"node_id":"RA_kwDOVeNBwM4qS0Iu","name":"graph-tui-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1116458,"digest":"sha256:2bcddaba2573faa2ec77bcbb2f3424cb0a7ca113b1e7034b8a180490596f26f0","download_count":5,"created_at":"2026-11-04T13:16:40Z","updated_at":"2026-11-04T13:16:40Z"}],"body":"`.gtui` format 9 (reads v1..v9). Crate 0.10.0.\n\n\n### Added\n\n- Right-drag pans like middle drag or `Ctrl` + left drag, and a right **click** opens the action menu\n  when the button is released: a right press is ambiguous, so nothing happens until it moves. Under\n  two cells of movement it counts as a click and the menu opens at the pressed cell; two cells or\n  more pans the view and no menu appears (even if you drag back to where you started). With a menu\n  already open a right press still only cancels it.\n\n### Changed\n\n- The style menu (`s` / right click) remembers its **stack** per kind (box, edge, colour): every\n  level you walked through, and the item you stood on in each. Opening it again goes straight back\n  down the same path with the cursor on the item you picked, and `h` walks back to the exact item\n  you came from instead of resetting to the first one. So changing a colour twice is `s`, `l`,\n  `Enter`. The `edit text…` entry is gone from the box menu (use `i` / `t`); `delete` stays as the\n  last item.\n\n"}
