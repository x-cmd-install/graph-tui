_at":"2026-11-05T12:00:47Z","updated_at":"2026-11-05T12:00:47Z"},{"id":713260482,"node_id":"RA_kwDOVeNBwM4qg33C","name":"graph-tui-x86_64-unknown-linux-gnu.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1088390,"digest":"sha256:216c169411a5255bdaa2125f438e7729a7822c6d06220caa8c7a104312281caf","download_count":1,"created_at":"2026-11-05T12:00:47Z","updated_at":"2026-11-05T12:00:47Z"},{"id":713267010,"node_id":"RA_kwDOVeNBwM4qg5dC","name":"graph-tui-x86_64-unknown-linux-musl.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":109,"digest":"sha256:13eb5662c81060669568e499712b0697285e910fc084fe3ccf542b0e5d34db8e","download_count":2,"created_at":"2026-11-05T12:02:49Z","updated_at":"2026-11-05T12:02:50Z"},{"id":713267011,"node_id":"RA_kwDOVeNBwM4qg5dD","name":"graph-tui-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/x-gtar","state":"uploaded","size":1144227,"digest":"sha256:ac798a323f791907c0e75b52fdd4f2cefc56a281b1d8f693dbe6321a9173c9f1","download_count":5,"created_at":"2026-11-05T12:02:49Z","updated_at":"2026-11-05T12:02:50Z"}],"body":"`.gtui` format 10 (reads v1..v10). Crate 0.11.0.\n\n\n### Changed\n\n- SVG export draws border glyphs as vector `<path>` segments and centres every character in its\n  cell, on a 9x18 px cell with a 15 px font. Before, the font's advance (8.42 px at 14 px) did not\n  match the 8 px cell, so glyphs drifted about 0.4 px per column and box corners broke up.\n- The jump list is global instead of per document: entries remember the tab as well as the cell, so\n  `Ctrl-o` after `gf` (or any tab switch) goes back to the previous buffer and position, and\n  `Ctrl-i` (`Tab`) walks forward again. Closing a tab drops its entries and shifts the rest.\n\n### Added\n\n- `w` / `b` (`jump_next` / `jump_prev`) cast a ray from the cursor along the picture's main axis\n  (right when the drawing is wider than it is tall, down when it is taller) and move the cursor to\n  the first **box or edge** the ray reaches — a connector between two boxes counts as a stop. The\n  ray stops at the viewport edge, and a direction with nothing in it only prints a message.\n  `toggle_labels` moved from `b` to `B` to free the vim keys.\n- `i` edits the cursor box's text **in the box**: no prompt line, the frame grows as you type,\n  `Enter` inserts a newline, `Esc` commits (one undo step) and `Ctrl-C` drops the draft. The caret\n  starts on the character the cursor is on (the end when it is outside the text) and is the only\n  cursor on screen — the terminal cursor is moved onto the draft, nothing is painted twice.\n  Left/Right/Home/End move by character and line, `Alt` + arrow by word, `Up`/`Down` keep the\n  column. On an empty cell `i` creates the box first and starts editing it (an untouched new box is\n  dropped again on `Esc`). `t` still edits through the prompt (multi-selection and `<|new box|>`\n  splitting), and a `point` node keeps the prompt because a one-cell name has no room for a draft.\n- `Ctrl+G` (`edit_text_external`) edits the cursor box's text in `$VISUAL` / `$EDITOR` and writes\n  the result straight into the box when the editor exits, as one undo step; `<|new box|>` splitting\n  applies. The prompt's `Ctrl+G` also applies its result immediately now instead of leaving the\n  text in the prompt for a second `Enter`.\n- Custom URI schemes are configurable: any `scheme://…` link is looked up in a new `[links]`\n  section (`custom = my-reader`) and the raw target is appended as **one** argument, run blocking\n  with the terminal suspended. An unconfigured scheme only says `no handler for scheme …`. The\n  core carries no vendor-specific scheme any more (there is a source audit test for it), and\n  `--print-config` shows an empty `[links]` example.\n- Link targets are parsed into a handler chain (`self` -> URL -> custom scheme -> local -> unknown) and\n  can end in a **position**: `[x](./src/app.rs:10,4)` opens `$VISUAL` / `$EDITOR` at line 10,\n  column 4 (nvim/vim get `+call cursor(10,4)`, other editors get `+10` and a note that the column\n  was dropped), `[x](self:10,4)` jumps the current document's cursor to cell `10,4` and\n  `[x](./other.gtui:10,4)` switches to that tab (opening one if needed) and jumps. URLs never take\n  a position, `.dot` ignores it, custom schemes have no handler by default, and\n  every jump is recorded so `Ctrl-o` goes back across tabs. The terminal suspend/resume for a\n  positioned edit is the `Ctrl+G` path; a `true` / `false` / `:` `$EDITOR` stub now counts as\n  unset.\n- Each edge can pick its own arrowhead glyphs: `head` is `auto|ascii|arrows|triangles` in the\n  `.gtui` file (format v10), settable from the right-click menu's `arrowhead` submenu or\n  `:head triangles`, one undo step, previewed live like every other menu item. `auto` keeps\n  following the global `--arrow` / `[prefs] arrow`, a new edge inherits the last chosen one, and\n  files from v9 and older load with `auto`.\n- A link keeps its link inside italics (`*[label](target)*`); bold already did.\n- Text can carry links: `[label](target)` renders as the underlined `label`, the target takes no\n  width, and `Enter` or `gf` on it opens the target. `http(s)://` and `mailto:` go to the opener,\n  `file://` / `~/` / `./` / `../` / `/` are resolved to a local path (relative ones against the\n  document directory), and a local `.gtui` / `.dot` opens as a tab instead of starting another\n  graph-tui. The opener is `[prefs] opener`, then `$OPENER`, then `opener` / `xdg-open`; when it is\n  the `opener` helper it is asked with `--which` and the `edit` answer runs with the terminal\n  suspended, so `nvim` can take over. `Enter` is now `open_link` (`confirm_selection` keeps no\n  default key and can be rebound).\n\n"}
